schema: "paperclip/v1"

# Codex agents use ChatGPT/Codex subscription OAuth from the persistent
# /paperclip/.codex auth volume. Do not bind OPENAI_API_KEY to codex_local
# agents, and do not set it globally in the Paperclip host env: Codex CLI
# 0.122+ treats that as API-key billing instead of subscription billing.

# gstack skills source — Paperclip pulls skills from this repo at the recorded ref.
# Bump `ref` only after `agents/deploy.sh --dry-run` shows the new catalog with
# zero unknown-desired-skills failures.
skills:
  source: "https://github.com/garrytan/gstack"
  ref: "main"
  update_method: "paperclip_skill_sync"  # POST /api/agents/<id>/skills/sync (per-agent)

agents:
  analyst:
    role: "researcher"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 200
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        enabled: true
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "required"

  ceo:
    role: "ceo"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 300
        model: "gpt-5.5"
        modelReasoningEffort: "xhigh"
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: true
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"

  comms-manager:
    role: "cmo"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 100
        model: "gpt-5.5"
        modelReasoningEffort: "medium"
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"
        # Bound to the existing Analyst read-only DB secret by CEO decision.
        # This is for Comms data reads; do not map to FFMEMES_DATABASE_URL.
        DATABASE_URL:
          kind: "secret"
          secretName: "ANALYST_DATABASE_URL"
          requirement: "required"
        FFMEMES_PROD_TELEGRAM_BOT_TOKEN:
          kind: "secret"
          requirement: "required"

  cto:
    role: "cto"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 300
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"
        SENTRY_AUTH_TOKEN:
          kind: "secret"
          requirement: "optional"
        SENTRY_ORG:
          kind: "plain"
          default: "ffmemes"
          requirement: "optional"
        SENTRY_PROJECT:
          kind: "plain"
          default: "ff-backend"
          requirement: "optional"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "optional"
        PREFECT_API_URL:
          kind: "secret"
          requirement: "optional"
        PREFECT_AUTH_STRING:
          kind: "secret"
          requirement: "optional"

  qa-engineer:
    role: "qa"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 200
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        intervalSec: 21600
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "required"
        # Coolify resource UUID + container name are intentionally NOT pinned
        # as plain defaults here. They are documented in agents/qa-engineer/
        # AGENTS.md (the "Key Coolify UUIDs" table) and resolved dynamically
        # from the Coolify API when needed. Hand-written UUID defaults rot
        # the moment Coolify rebuilds the container.
        PREFECT_API_URL:
          kind: "secret"
          requirement: "required"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "required"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "required"
        SENTRY_AUTH_TOKEN:
          kind: "secret"
          requirement: "required"
        SENTRY_ORG:
          kind: "plain"
          default: "ffmemes"
          requirement: "optional"
        SENTRY_PROJECT:
          kind: "plain"
          default: "ff-backend"
          requirement: "optional"
        PREFECT_AUTH_STRING:
          kind: "secret"
          requirement: "required"
        PAPERCLIP_API_KEY:
          kind: "secret"
          requirement: "optional"
        PAPERCLIP_URL:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_API_ID:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_API_HASH:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_SESSION_STRING:
          kind: "secret"
          requirement: "optional"

  release-engineer:
    role: "devops"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 150
        model: "gpt-5.5"
        modelReasoningEffort: "medium"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        GH_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "optional"

  staff-engineer:
    role: "engineer"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 200
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"

company:
  brandColor: "#e4a54d"
  logoPath: "images/company-logo.jpg"

sidebar:
  agents:
    - "ceo"
    - "analyst"
    - "comms-manager"
    - "cto"
    - "qa-engineer"
    - "release-engineer"
    - "staff-engineer"
