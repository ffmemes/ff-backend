schema: "paperclip/v1"

# gstack skills source — Paperclip pulls latest skills from this repo. Updated via routine.
skills:
  source: "https://github.com/garrytan/gstack"

agents:
  analyst:
    role: "researcher"
    adapter:
      type: "claude_local"
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 200
        model: "claude-sonnet-4-6"
    runtime:
      heartbeat:
        enabled: true
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "required"

  ceo:
    role: "ceo"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 300
        model: "gpt-5.5"
        modelReasoningEffort: "xhigh"
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
        maxConcurrentRuns: 1
    permissions:
      canCreateAgents: true
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        OPENAI_API_KEY:
          kind: "secret"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"

  comms-manager:
    role: "cmo"
    adapter:
      type: "claude_local"
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 100
        model: "claude-sonnet-4-6"
    runtime:
      heartbeat:
        enabled: true
        intervalSec: 86400
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"
        # Bound to the existing Analyst read-only DB secret by CEO decision.
        # This is for Comms data reads; do not map to FFMEMES_DATABASE_URL.
        DATABASE_URL:
          kind: "secret"
          secretName: "ANALYST_DATABASE_URL"
          requirement: "required"
        FFMEMES_PROD_TELEGRAM_BOT_TOKEN:
          kind: "secret"
          requirement: "required"
        OPENAI_API_KEY:
          kind: "secret"
          requirement: "optional"

  cto:
    role: "cto"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 300
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        OPENAI_API_KEY:
          kind: "secret"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"
        SENTRY_AUTH_TOKEN:
          kind: "secret"
          requirement: "optional"
        SENTRY_ORG:
          kind: "plain"
          default: "ffmemes"
          requirement: "optional"
        SENTRY_PROJECT:
          kind: "plain"
          default: "ff-backend"
          requirement: "optional"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "optional"
        PREFECT_API_URL:
          kind: "secret"
          requirement: "optional"
        PREFECT_AUTH_STRING:
          kind: "secret"
          requirement: "optional"

  qa-engineer:
    role: "qa"
    adapter:
      type: "claude_local"
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 200
        model: "claude-sonnet-4-6"
    runtime:
      heartbeat:
        intervalSec: 21600
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "required"
        COOLIFY_RESOURCE_UUID:
          kind: "plain"
          default: "k4w804sco4s8kc88kwcw0ow4"
          requirement: "optional"
        COOLIFY_CONTAINER_NAME:
          kind: "plain"
          default: "k4w804sco4s8kc88kwcw0ow4-131756368009"
          requirement: "optional"
        PREFECT_API_URL:
          kind: "plain"
          default: "http://65.108.127.32:4200/api"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "required"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "required"
        SENTRY_AUTH_TOKEN:
          kind: "secret"
          requirement: "required"
        SENTRY_ORG:
          kind: "plain"
          default: "ffmemes"
          requirement: "optional"
        SENTRY_PROJECT:
          kind: "plain"
          default: "ff-backend"
          requirement: "optional"
        PREFECT_AUTH_STRING:
          kind: "secret"
          requirement: "required"
        PAPERCLIP_API_KEY:
          kind: "secret"
          requirement: "optional"
        PAPERCLIP_URL:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_API_ID:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_API_HASH:
          kind: "secret"
          requirement: "optional"
        TELEGRAM_SESSION_STRING:
          kind: "secret"
          requirement: "optional"

  release-engineer:
    role: "devops"
    adapter:
      type: "claude_local"
      config:
        dangerouslySkipPermissions: true
        maxTurnsPerRun: 150
        model: "claude-sonnet-4-6"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        GH_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_ACCESS_TOKEN:
          kind: "secret"
          requirement: "optional"
        COOLIFY_BASE_URL:
          kind: "secret"
          requirement: "optional"

  staff-engineer:
    role: "engineer"
    adapter:
      type: "codex_local"
      config:
        dangerouslyBypassApprovalsAndSandbox: true
        maxTurnsPerRun: 200
        model: "gpt-5.5"
        modelReasoningEffort: "high"
    runtime:
      heartbeat:
        maxConcurrentRuns: 1
    inputs:
      env:
        OPENCLAW_SESSION:
          kind: "plain"
          default: "1"
          requirement: "optional"
        PATH:
          kind: "plain"
          default: "/paperclip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          requirement: "optional"
        OPENAI_API_KEY:
          kind: "secret"
          requirement: "optional"
        ANALYST_DATABASE_URL:
          kind: "secret"
          requirement: "optional"

company:
  brandColor: "#e4a54d"
  logoPath: "images/company-logo.jpg"

sidebar:
  agents:
    - "ceo"
    - "analyst"
    - "comms-manager"
    - "cto"
    - "qa-engineer"
    - "release-engineer"
    - "staff-engineer"
