name: Staff Engineer Review Trigger

# pull_request_target runs the workflow from the BASE branch (production),
# not the PR's head branch. This ensures the trigger fires for ALL PRs,
# even those created before this workflow existed.
# Safe because this job only fires a webhook — no code checkout.
on:
  pull_request_target:
    branches: [production]
    types: [opened, reopened, synchronize, edited]

jobs:
  notify-staff-engineer:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Staff Engineer review
        env:
          PAPERCLIP_PR_REVIEW_TRIGGER_URL: ${{ secrets.PAPERCLIP_PR_REVIEW_TRIGGER_URL }}
          PAPERCLIP_TRIGGER_SECRET: ${{ secrets.PAPERCLIP_TRIGGER_SECRET }}
        run: |
          # --fail makes curl exit non-zero on HTTP >=400 so a rotated secret,
          # bad URL, or Paperclip outage fails the workflow instead of silently
          # leaving a fake-green PR with no Staff Engineer wake queued.
          # -o /dev/null discards the response body: Paperclip 4xx pages can
          # echo the requested trigger path and 5xx bodies can leak internals,
          # both forbidden by the architecture plan.
          curl -sS --fail -o /dev/null -X POST \
            "$PAPERCLIP_PR_REVIEW_TRIGGER_URL" \
            -H "Authorization: Bearer $PAPERCLIP_TRIGGER_SECRET" \
            -H "Content-Type: application/json" \
            -d '{"pr_number": ${{ github.event.pull_request.number }}, "pr_url": "${{ github.event.pull_request.html_url }}"}'
