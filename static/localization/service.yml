help.text:
  en: |-
    <b>Fast Food Memes</b>

    Feed: like ❤️ / skip ⏬ under each meme.

    /last — show the previous meme again (with buttons; you can change your reaction)

    Upload — just send a meme to the bot
    /uploads — your uploads

    Share — button under the meme, or @ffmemesbot in any chat

    /lang — meme languages
    /kitchen — burgers 🍔
    /balance · /leaderboard · /nickname

    /chat — message us
    /delete — delete your data
  ru: |-
    <b>Fast Food Memes</b>

    Лента: лайк ❤️ / скип ⏬ под мемом.

    /last — показать прошлый мем (с кнопками; реакцию можно поменять)

    Загрузка — просто пришли мем боту
    /uploads — твои загрузки

    Поделиться — кнопка под мемом или @ffmemesbot в любом чате

    /lang — языки мемов
    /kitchen — бургеры 🍔
    /balance · /leaderboard · /nickname

    /chat — написать нам
    /delete — удалить данные
  uk: |-
    <b>Fast Food Memes</b>

    Стрічка: лайк ❤️ / скіп ⏬ під мемом.

    /last — показати попередній мем (з кнопками; реакцію можна змінити)

    Завантаження — просто надішли мем боту
    /uploads — твої завантаження

    Поділитися — кнопка під мемом або @ffmemesbot у будь-якому чаті

    /lang — мови мемів
    /kitchen — бургери 🍔
    /balance · /leaderboard · /nickname

    /chat — написати нам
    /delete — видалити дані

last.none:
  en: |-
    No previous meme yet — press /start and watch a few first.
  ru: |-
    Пока нечего возвращать — жми /start и посмотри пару мемов.
  uk: |-
    Поки немає попереднього мема — натисни /start і подивись кілька мемів.

last.unavailable:
  en: |-
    Couldn't re-send that meme. Try /start for a new one.
  ru: |-
    Не получилось показать прошлый мем. Жми /start за новым.
  uk: |-
    Не вийшло показати попередній мем. Тисни /start за новим.

service.out_of_memes:
  en: |-
    🚀 You've watched all the memes we've prepared for you! 
    
    Come back tomorrow for MORE or add more languages: /lang. 🍔
  ru: |-
    МЕМЫ НА СЕГОДНЯ ЗАКОНЧИЛИСЬ 
    
    Приходи завтра за новой порцией или добавь больше языков: /lang. 🍔
  uk: |-
    МЕМИ НА СЬОГОДНІ ЗАКІНЧИЛИСЬ 
    
    Приходь завтра за новою порцією або додай більше мов: /lang. 🍔
  es: |-
    🚀 ¡Has visto todos los memes que hemos preparado para ti! 
    
    Vuelve mañana para MÁS o agrega más idiomas: /lang. 🍔
  pt-br: |-
    🚀 Você viu todos os memes que preparamos para você! 
    
    Volte amanhã para MAIS ou adicione mais idiomas: /lang. 🍔
  fr: |-
    🚀 Tu as vu tous les memes que nous avons préparés pour toi! 
    
    Reviens demain pour PLUS ou ajoute plus de langues: /lang. 🍔
  it: |-
    🚀 Hai visto tutti i meme che abbiamo preparato per te! 
    
    Torna domani per ALTRO o aggiungi più lingue: /lang. 🍔
  de: |-
    🚀 Du hast alle Memes gesehen, die wir für dich vorbereitet haben! 
    
    Komm morgen wieder für MEHR oder füge mehr Sprachen hinzu: /lang. 🍔
  tr: |-
    🚀 Senin için hazırladığımız tüm memeleri izledin! 
    
    YARIN DAHA FAZLASI için geri gel veya daha fazla dil ekle: /lang. 🍔
  fa: |-
    🚀 تمام میم‌هایی که برای شما آماده کرده‌ایم را دیده‌اید! 
    
    فردا برای بیشتر برگردید یا زبان‌های بیشتری اضافه کنید: /lang. 🍔
  uz: |-
    🚀 Siz uchun tayyorlagan barcha memlarni ko'rdingiz! 
    
    ERTAGI KO'PROQ uchun qayting yoki ko'proq tillar qo'shing: /lang. 🍔
  ar: |-
    🚀 لقد شاهدت جميع الصور النمطية التي قمنا بإعدادها لك! 
    
    عد غدًا للمزيد أو أضف المزيد من اللغات: /lang. 🍔
  hi: |-
    🚀 आपने जोक्स देख लिए हैं जो हमने आपके लिए तैयार किए हैं! 
    
    कल वापस आइए और अधिक देखें या अधिक भाषाएँ जोड़ें: /lang. 🍔

service.bot_updated:
  en: |-
    🔄 The bot was updated. Press /start to continue.
  ru: |-
    🔄 Бот обновился. Нажми /start, чтобы продолжить.
  uk: |-
    🔄 Бот оновився. Натисни /start, щоб продовжити.

