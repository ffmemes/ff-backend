  ru: |-
    ❌ Что-то пошло не так при загрузке мема в Telegram. Просто попробуй ещё раз.

  uk: |-
    ❌ Щось пішло не так при завантаженні мема в Telegram. Просто спробуй ще раз.


upload.file_too_big:
