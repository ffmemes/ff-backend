friend_offer:
  en: "Which of your favourite memes would make a friend laugh? Pick five and send them a little challenge."
  ru: "Какие из твоих любимых мемов рассмешат друга? Собери пять и предложи ему проверить."
friend_create:
  en: "Choose five for a friend"
  ru: "Собрать пять для друга"
friend_dismiss:
  en: "Close"
  ru: "Закрыть"
friend_preview:
  en: "Here are five candidates, starting with your likes. Check all five before sharing. Confirm only if these are the memes you want to send."
  ru: "Вот пять кандидатов — сначала твои лайки. Посмотри все пять перед отправкой. Подтверди, если хочешь отправить именно их."
friend_confirm:
  en: "Yes, these are my five"
  ru: "Да, это мой выбор"
friend_confirm_prompt:
  en: "Send these five to a friend?"
  ru: "Предложить другу эти пять?"
friend_share:
  en: "Send to a friend"
  ru: "Отправить другу"
friend_invitation:
  en: "I picked five memes for you. How many will make you laugh?"
  ru: "Я выбрал для тебя пять мемов. Сколько тебе зайдёт?"
friend_link_ready:
  en: "Your five are ready. Choose a friend to send them to, or copy this link:"
  ru: "Твои пять готовы. Выбери друга для отправки или скопируй ссылку:"
friend_position:
  en: "Meme {position} of 5"
  ru: "Мем {position} из 5"
friend_funny:
  en: "Funny 😄"
  ru: "Смешно 😄"
friend_pass:
  en: "Not for me"
  ru: "Не зашло"
friend_result:
  en: "You liked {liked} of your friend’s 5 memes. Your own feed is ready — your likes will help choose what comes next."
  ru: "Тебе зашли {liked} из 5 мемов друга. Дальше — твоя лента: эти лайки помогут подобрать следующие мемы."
friend_feed:
  en: "Continue my feed"
  ru: "Продолжить свою ленту"
friend_resume:
  en: "Continue the five memes"
  ru: "Продолжить пять мемов"
friend_saved:
  en: "That answer is already saved. You can continue from where you left off."
  ru: "Этот ответ уже сохранён. Можно продолжить с того места, где остановился."
friend_unavailable:
  en: "These five memes are unavailable right now. You can continue your feed."
  ru: "Эта подборка сейчас недоступна. Можно продолжить свою ленту."
friend_not_enrolled:
  en: "Creating a set is available to regular feed users and people who finished a friend’s five memes. Your feed is available as usual."
  ru: "Создание подборки доступно постоянным читателям ленты и тем, кто прошёл пять мемов друга. Твоя лента доступна как обычно."
friend_not_enough:
  en: "I couldn’t find five available memes for your set yet. Try again after a few likes in your feed."
  ru: "Пока не удалось найти пять доступных мемов для подборки. Попробуй после нескольких лайков в ленте."
friend_send_failed:
  en: "I couldn’t show this meme. Try continuing again, or open your feed."
  ru: "Не получилось показать мем. Попробуй продолжить ещё раз или открой ленту."
